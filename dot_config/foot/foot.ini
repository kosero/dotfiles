[main]
term=xterm-256color
font=Iosevka:size=14
font-bold=Iosevka:weight=bold:size=14
pad=10x10
dpi-aware=no
initial-window-mode=windowed

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[csd]
preferred=server

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f

[colors-dark]
alpha=1
background=151515
foreground=E1E1E1

cursor=151515 D0D0D0
selection-foreground=E1E1E1
selection-background=38404f
urls=A2B5C1

regular0=202020
regular1=984936
regular2=90A959
regular3=ab8550
regular4=7E97AB
regular5=AA749F
regular6=88afa2
regular7=AFAFAF

bright0=727272
bright1=b46958
bright2=90A959
bright3=F4BF75
bright4=BAD7FF
bright5=AA759F
bright6=A2B5C1
bright7=E1E1E1

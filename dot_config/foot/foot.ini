[main]
term=xterm-256color
font=Iosevka:size=14
font-bold=Iosevka:weight=bold:size=14
pad=10x10
dpi-aware=no
initial-window-mode=windowed

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[csd]
preferred=server

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f

[colors-dark]
foreground=321424
background=c89664

selection-foreground=321424
selection-background=e3c196

cursor=c89664 321424
urls=1f3a6e

jump-labels=c89664 5a2468
scrollback-indicator=c89664 321424
search-box-no-match=c89664 7f1d2d
search-box-match=321424 e3c196

regular0=321424
regular1=7f1d2d
regular2=2f4f1c
regular3=5c4200
regular4=1f3a6e
regular5=5a2468
regular6=14504f
regular7=4a2f28

bright0=6b4a3a
bright1=a02a3c
bright2=3f6a26
bright3=7a5a00
bright4=2a4f96
bright5=7a3490
bright6=1c6a68
bright7=e3c196
